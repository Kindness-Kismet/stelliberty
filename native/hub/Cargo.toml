[package]
name = "hub"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
interoptopus = "^0.16.4"
anyhow = "^1.0.104"
thiserror = "^2.0.20"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
serde_yaml_ng = "^0.10.0"
rquickjs = { version = "^0.13.0", features = ["loader"] }
tokio = { version = "^1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
once_cell = "^1.21.4"
tracing = "^0.1.44"
tracing-subscriber = { version = "^0.3.23", features = ["fmt", "env-filter"] }
interprocess = { version = "^2.4.3", features = ["tokio"] }
async-trait = "^0.1.92"
tokio-tungstenite = "^0.30.0"
futures-util = "^0.3.34"
age = { version = "^0.12.1", features = ["armor"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "^0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[lints]
workspace = true
